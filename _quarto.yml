project:
  type: website

website:
  title: "Open R Sessions (Lund)"
  description: "Iain R. Moodie's materials for the Open R Sessions at the Department of Biology, Lund University, Sweden."

  open-graph: true

  page-footer: 
    left: "Materials under a [CC-BY-SA-4.0 License](https://creativecommons.org/licenses/by-sa/4.0/deed.en)"
    right:  "Built by [Iain R. Moodie](https://irmoodie.com) with [Quarto](https://quarto.org/)."

  sidebar:
    pinned: true
    collapse: true
    align: center
    style: floating
    search: true
    collapse-level: 0
    contents:
      - section: "Introduction to R"
        contents:
          - href: slides/intro.qmd
            text: "0) Slides"
          - href: exercises/01_local_r.qmd
            text: "1) How to install R and RStudio"
          - href: exercises/02_intro_to_r.qmd
            text: "2) Introduction to R and RStudio"
          - href: exercises/3_r_concepts.qmd
            text: "3) Programming concepts in R (Online)"

format:
  html:
    theme: [cosmo, brand, styles.scss]
    mainfont: "Atkinson Hyperlegible"
    code-copy: true
    code-overflow: wrap
    toc: true
    link-external-newwindow: true
    link-external-filter: ^(?:http:|https:)\\/\\/irmoodie\\.com\\/custom
execute:
  freeze: auto

